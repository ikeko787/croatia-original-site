<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>Travel Croatia</title>
    <meta name="description" content="忘れていた、純粋な好奇心を呼び覚ますクロアチアの旅。アドリア海の絶景、グルメ、観光情報をエンジニアの視点でご紹介します。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="img/fabicon.png">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <header class="header">
        <h1>
            <a href="index.html">
                <img src="img/main-logo.jpg" alt="Travel Croatia">
            </a>
        </h1>
        <nav class="header-nav">
            <ul class="header-nav-list">
                <li><a href="about-croatia.html">クロアチアについて</a></li>
                <li><a href="best-trip.html">おすすめ観光地</a></li>
                <li><a href="gourmet.html">グルメ</a></li>
                <li><a href="blog.html">ブログ</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
            </ul>
        </nav>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="mask"></div>
    </header>
    <main>
        <div class="mainvisual-lower">
            <img src="img/contact-section-mainvisual 1.jpg" alt="">
            <div class="mainvisual-catchcopy-lower">
                <h2>お問い合わせ</h2>
            </div>
        </div>

        <section class="contact-container">
            <h2 class="contact-section-title">
                あなたの「声」を聞かせてください。旅の相談、サイトの感想、ポマロな生き方について
            </h2>
            <form action="#" method="post" class="contact-form">
                <div class="contact-form-group">
                    <label for="name">お名前<span>*</span></label>
                    <input type="text" id="name" name="name" placeholder="クロアチア 太郎" required>
                </div>
                <div class="contact-form-group">
                    <label for="company">会社名・屋号(任意)</label>
                    <input type="text" id="company" name="company" placeholder="株式会社 ○○○">
                </div>
                <div class="contact-form-group">
                    <label for="email">メールアドレス<span>*</span></label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                <div class="contact-form-group">
                    <label for="tel">電話番号(任意)</label>
                    <input type="tel" id="tel" name="tel" placeholder="090-1234-5678">
                </div>
                <div class="contact-form-group">
                    <div class="contact-radio-group">
                        <div class="contact-radio-item">
                            <input type="radio" id="type_consult" name="contact_type" value="ご相談" checked> <label
                                for="type_consult">ご相談</label>
                        </div>
                        <div class="contact-radio-item">
                            <input type="radio" id="type_document" name="contact_type" value="資料請求"> <label
                                for="type_document">資料請求</label>
                        </div>
                    </div>
                    <input type="text" name="address" placeholder="※資料請求の場合は住所を入力してください" class="contact-address-input">
                </div>
                <div class="contact-form-group">
                    <label for="message">メッセージ</label>
                    <textarea id="message" name="message" rows="5" placeholder="ご相談内容をご入力してください"></textarea>
                </div>
                <div class="form-submit">
                    <button type="submit" class="btn-submit">この内容で送信する</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <a href="#" class="to-top">TOP</a>
        <small>&copy; 2026 KAZUSHI KOIKE Travel Croatia</small>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
