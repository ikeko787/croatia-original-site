    <main>
        <div class="mainvisual-lower">
            <img src="img/about-mainvisual 3.jpg" alt="">
            <div class="mainvisual-catchcopy-lower">
                <h2>ただ、そこに在る<br>
                    だけでいい場所</h2>
            </div>
        </div>
        <section class="story">
            <div class="container-lower">
                <div class="story-section">
                    <h2 class="story-section-title">地理と気候</h2>
                    <p class="story-section-en">Geography & Climate</p>
                </div>
                <div class="story-content">
                    <figure class="story-content-item">
                        <div class="story-content-image">
                            <img src="img/geography-img2 1.jpg" alt="">
                        </div>
                        <figcaption class="story-content-text">
                            <h3>「琥珀の湾岸線」</h3>
                            <p>1000を超える島々と、透き通るアドリア海。深青はどこまでも続く静寂の証。ただ眺めているだけで、心は凪いていく。</p>
                        </figcaption>
                    </figure>
                    <figure class="story-content-item">
                        <div class="story-content-image">
                            <img src="img/geography-img1 1.jpg" alt="">
                        </div>
                        <figcaption class="story-content-text">
                            <h3>「オレンジの屋根」</h3>
                            <p>中世の面影を残す石造りの街並み。夕陽を映すオレンジの屋根が積み重なった時間の優しさを教えてくれる。</p>
                        </figcaption>
                    </figure>
                </div>
            </div>
            <figure class="story-history">
                <div class="story-history-inner">
                    <img src="img/history-section-img 1.jpg" alt="">
                    <div class="story-history-content">
                        <h2 class="story-section-title">歴史</h2>
                        <p class="story-section-en">History</p>
                        <p class="story-history-introduction">古代ローマから続く石畳。戦いも、平和も、すべて飲み込み、<br>
                            街はただ力強く、優しく佇んでいる。</p>
                    </div>
                </div>
            </figure>
            <div class="container-lower">
                <div class="story-section">
                    <h2 class="story-section-title">自然</h2>
                    <p class="story-section-en">Nature</p>
                </div>
                <div class="story-content">
                    <figure class="story-content-item">
                        <div class="story-content-image">
                            <img src="img/nature-section-img 1.jpg" alt="">
                        </div>
                        <figcaption class="story-content-text">
                            <h3>「琥珀から新緑へ」</h3>
                            <p>16の湖と滝がおりなす、プリトヴィツェ。揺らぐ水面と、深く澄んだ森の吐息。自然の鼓動が自分を「無」にしてくれる。</p>
                        </figcaption>
                    </figure>
                    <figure class="story-content-item">
                        <div class="story-content-image">
                            <img src="img/nature-section-img2 1.jpg" alt="">
                        </div>
                        <figcaption class="story-content-text">
                            <h3>「凪が選ぶ、紫の記憶」</h3>
                            <p>島々を彩るラベンダーの香りと、降り注ぐ光。五感のすべてが優しく解き放たれる。ここでは、心のための聖域。</p>
                        </figcaption>
                    </figure>
                </div>
            </div>
